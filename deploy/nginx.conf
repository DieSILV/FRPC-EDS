# ==================================================================
# FRPC-EDS - nginx (alternativa a Caddy)
# /etc/nginx/sites-available/eds.conf  →  ln -s ... sites-enabled/
#
# Certificado wildcard con certbot + DNS-01, por ejemplo Cloudflare:
#   apt install certbot python3-certbot-dns-cloudflare
#   printf "dns_cloudflare_api_token = TU_TOKEN\n" > /root/.secrets/cf.ini
#   chmod 600 /root/.secrets/cf.ini
#   certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/cf.ini \
#     -d eds.dev -d '*.eds.dev' --agree-tos -m tu-correo@ejemplo.com
# ==================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name eds.dev *.eds.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25: usa "listen 443 ssl http2;"
    server_name eds.dev *.eds.dev;

    ssl_certificate     /etc/letsencrypt/live/eds.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eds.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Los túneles pueden subir archivos grandes
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Panel: panel.eds.dev → 127.0.0.1:7800
server {
    listen 443 ssl;
    http2 on;
    server_name panel.eds.dev;

    ssl_certificate     /etc/letsencrypt/live/eds.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eds.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;            # necesario para el stream de logs (SSE)
        proxy_read_timeout 3600s;
    }
}
