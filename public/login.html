<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FRPC-EDS · Acceso</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <div class="logo">◈</div>
        <h1>FRPC-EDS</h1>
        <p class="sub">Panel de control de túneles</p>

        <div class="form-grid">
          <div class="field">
            <label for="user">Usuario</label>
            <input id="user" name="user" type="text" autocomplete="username" required autofocus />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn primary" type="submit" id="submit">Entrar</button>
        </div>

        <div class="login-error" id="error"></div>
      </form>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
